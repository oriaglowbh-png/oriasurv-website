<style>
html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;background:#fff}
a{color:var(--brand-primary);text-decoration:none}a:hover{color:var(--purple-700)}
.wrap{max-width:var(--container);margin:0 auto;padding:96px 24px;box-sizing:border-box}
.hero{padding:64px 24px 72px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.foot{grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.nav-links{display:flex;gap:24px}.navlink{font:500 15px var(--font-ui);color:var(--gray-700);transition:color .2s}.navlink:hover{color:var(--brand-primary)}
.burger{display:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--surface-tint);color:var(--brand-primary);cursor:pointer;align-items:center;justify-content:center}
.mobile-nav{display:flex;flex-direction:column;padding:8px 24px 20px;border-top:1px solid var(--border-subtle)}.mobile-nav a{padding:12px 0;font:500 16px var(--font-ui);color:var(--gray-700)}
.ico-tile{width:48px;height:48px;flex:none;border-radius:14px;background:var(--surface-tint);color:var(--brand-primary);display:flex;align-items:center;justify-content:center}
.tour-item{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border:1px solid transparent;border-radius:18px;background:transparent;cursor:pointer;transition:all .25s var(--ease-out)}
.tour-item:hover{background:#fff}.tour-item.on{background:#fff;border-color:var(--lavender-300);box-shadow:var(--shadow-card)}
.shot{width:min(100%,340px);aspect-ratio:1320/2868;border-radius:32px;overflow:hidden;background:#fff;box-shadow:var(--shadow-raised)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .45s var(--ease-out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step{background:var(--surface-tint-soft);border:1px solid var(--lavender-200);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;animation:fadeIn .4s var(--ease-out);transition:transform .25s var(--ease-out),box-shadow .25s}
.step:hover{transform:translateY(-3px);box-shadow:var(--shadow-raised)}
.vendor-panel{background:var(--purple-900);border-radius:32px;padding:56px 48px;align-items:center}
.vben{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.flink{font:400 14px var(--font-body);color:var(--lavender-200)}.flink:hover{color:#fff}
@media (max-width:1080px){.nav-links{display:none}.burger{display:flex}}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr);gap:36px}.g4,.foot{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:64px 20px}.hero{padding:40px 20px 56px}.vendor-panel{padding:40px 24px}.tour>div:last-child{order:-1}}
@media (max-width:560px){.hide-sm{display:none}.g4,.foot{grid-template-columns:minmax(0,1fr)}.vendor-panel .g2{grid-template-columns:minmax(0,1fr)}h2{font-size:34px!important}}
.legal-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px;align-items:start}
.toc{position:sticky;top:100px;display:flex;flex-direction:column;gap:2px}
.toc button{display:flex;gap:12px;align-items:baseline;text-align:left;padding:10px 14px;border:0;border-radius:12px;background:transparent;cursor:pointer;font:500 14px/1.35 var(--font-ui);color:var(--gray-600);transition:all .2s var(--ease-out)}
.toc button span{font:600 12px var(--font-ui);color:var(--gray-400)}.toc button:hover{background:var(--lavender-50);color:var(--brand-primary)}
.toc button.on{background:var(--surface-tint);color:var(--brand-primary)}.toc button.on span{color:var(--brand-primary)}
.toc-help{margin-top:20px;padding:18px;border-radius:18px;background:var(--surface-tint-soft);border:1px solid var(--lavender-200);display:flex;flex-direction:column;gap:6px}
.legal-switch{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#fff;border:1px solid var(--border-subtle);border-radius:999px}
.legal-switch a{padding:8px 16px;border-radius:999px;font:500 14px var(--font-ui);color:var(--gray-700)}.legal-switch a:hover{color:var(--brand-primary)}.legal-switch a.on{background:var(--brand-primary);color:#fff}
.lsec{background:#fff;border:1px solid var(--border-subtle);border-radius:22px;padding:28px 32px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px;transition:border-color .2s,box-shadow .2s}.lsec:hover{border-color:var(--lavender-300);box-shadow:var(--shadow-card)}
.num{width:40px;height:40px;flex:none;border-radius:12px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;justify-content:center;font:600 14px var(--font-ui)}
.lp{margin:0;font:400 16px/1.65 var(--font-body);color:var(--text-body);text-wrap:pretty;max-width:72ch}
.ll{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.ll li{display:flex;gap:12px;align-items:flex-start;font:400 16px/1.55 var(--font-body);color:var(--text-body)}
.chk{width:22px;height:22px;flex:none;margin-top:1px;border-radius:999px;background:var(--green-100);color:var(--green-600);display:flex;align-items:center;justify-content:center}.chk.neg{background:var(--red-100);color:var(--red-600)}
.glance>div{background:var(--surface-tint-soft);border:1px solid var(--lavender-200);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.ccard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--page-50);border:1px solid var(--border-subtle)}a.ccard[href]:hover{border-color:var(--lavender-300)}
@media (max-width:900px){.legal-grid{grid-template-columns:minmax(0,1fr);gap:24px}.toc{position:static;display:none}.lsec{padding:22px 20px}}
